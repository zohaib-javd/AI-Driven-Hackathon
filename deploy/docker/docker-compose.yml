# Docker Compose for Physical AI RAG System
# Complete stack with Cohere embeddings, Qdrant, and OpenAI
#
# SECURITY NOTICE:
# - All credentials are loaded from environment variables
# - Copy .env.example to .env and fill in your actual values
# - NEVER commit .env to version control
# - The backend will REFUSE TO START without required credentials

version: '3.8'

services:
  # FastAPI Backend with RAG capabilities
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: physical-ai-backend
    ports:
      - "8000:8000"
    environment:
      # ===================
      # REQUIRED CREDENTIALS
      # ===================
      # Backend will FAIL TO START if any of these are missing

      # Neon Serverless Postgres
      - DATABASE_URL=${DATABASE_URL}

      # Cohere Embeddings (embed-english-v3.0)
      - COHERE_API_KEY=${COHERE_API_KEY}

      # Qdrant Vector Store
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}

      # OpenAI Chat (gpt-4-turbo-preview)
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # ===================
      # OPTIONAL CONFIGURATION
      # ===================

      # Model Configuration
      - COHERE_EMBEDDING_MODEL=${COHERE_EMBEDDING_MODEL:-embed-english-v3.0}
      - COHERE_EMBEDDING_DIMENSION=${COHERE_EMBEDDING_DIMENSION:-1024}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4-turbo-preview}

      # Vector Store
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-book_chunks}

      # RAG Configuration
      - CHUNK_SIZE=${CHUNK_SIZE:-500}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}

      # CORS - Frontend domains allowed
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,https://hackathon01-lilac.vercel.app}

      # Application
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../physical-ai-humanoid-robotics/docs:/app/docs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      - qdrant
    networks:
      - physical-ai-network

  # Local Qdrant Vector Database (for development)
  # Use Qdrant Cloud for production
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: physical-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - physical-ai-network

  # Docusaurus Frontend with RAG Chatbot
  frontend:
    build:
      context: ../../physical-ai-humanoid-robotics
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: physical-ai-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../../physical-ai-humanoid-robotics:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Frontend uses backend proxy - NO direct API access
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - physical-ai-network

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: physical-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - physical-ai-network
    profiles:
      - prod

networks:
  physical-ai-network:
    driver: bridge

volumes:
  qdrant_data:
